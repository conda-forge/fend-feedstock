context:
  version: "1.5.9"

package:
  name: fend
  version: ${{ version }}

source:
  url: https://github.com/printfn/fend/archive/v${{ version }}.tar.gz
  sha256: 3622b09d197d4be374880f3f97256633d0481e7a3c7da2f69f2cb5141aac1721

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - pandoc
    - pkg-config
  host:
    - openssl

tests:
  - script:
      - fend --help

about:
  license: MIT
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml
  summary: Arbitrary-precision unit-aware calculator
  homepage: https://printfn.github.io/fend
  repository: https://github.com/printfn/fend

extra:
  recipe-maintainers:
    - danielnachun
